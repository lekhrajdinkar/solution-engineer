site_name: Solution Engineer Docs
site_description: Learning, PoC, and Research Documentation
repo_url: https://github.com/lekhrajdinkar/senior-system-engineer
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
  - scheme: default
    primary: blue
    accent: light-blue
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: blue
    accent: light-blue
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.tabs
  - search.suggest
  - search.highlight
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- codehilite
- meta
- pymdownx.arithmatex
- pymdownx.betterem
- pymdownx.caret
- pymdownx.critic
- pymdownx.details
- pymdownx.emoji
- pymdownx.highlight:
    use_pygments: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde
- tables
- toc:
    permalink: true
